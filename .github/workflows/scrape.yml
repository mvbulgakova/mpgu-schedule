name: Scrape Schedules

on:
  schedule:
    - cron: "0 5,17 * * *"   # 08:00 и 20:00 МСК (UTC+3)
  workflow_dispatch:
    inputs:
      institute_id:
        description: "ID конкретного института (пусто = все)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to data branch
        run: |
          git fetch origin data 2>/dev/null && git checkout data || {
            git checkout --orphan data
            git rm -rf . --quiet 2>/dev/null || true
          }

      - name: Stash data, checkout code to subdir
        run: |
          mkdir -p /tmp/code
          git clone --depth=1 --branch main . /tmp/code

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: /tmp/code/scraper/requirements.txt

      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y ghostscript poppler-utils

      - name: Install Python deps
        run: pip install -r /tmp/code/scraper/requirements.txt

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_PATH: ${{ github.workspace }}
          CHANGED_ONLY: "true"
          INSTITUTE_ID: ${{ github.event.inputs.institute_id }}
          PYTHONPATH: /tmp/code
        run: python -m scraper.main

      - name: Commit and push
        run: |
          git config user.name "MPGU Schedule Bot"
          git config user.email "bot@github-actions"
          git add -A
          git diff --staged --quiet && echo "Нет изменений" && exit 0
          git commit -m "Update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin data
