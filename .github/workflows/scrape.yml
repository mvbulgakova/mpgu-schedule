name: Scrape Schedules

on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:
    inputs:
      institute_id:
        description: "ID конкретного института (пусто = все)"
        required: false
        default: ""
      force_rescrape:
        description: "Перепарсить все файлы заново (игнорировать кеш хешей)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      institutes: ${{ steps.set.outputs.institutes }}
    steps:
      - id: set
        run: |
          FILTER="${{ github.event.inputs.institute_id }}"
          ALL='["biology","childhood","philology","physics","sport","social","geography","history","math","arts","preschool","pedagogy","languages","international","journalism","teaching_development","digital"]'
          if [ -n "$FILTER" ]; then
            echo "institutes=[\"$FILTER\"]" >> "$GITHUB_OUTPUT"
          else
            echo "institutes=$ALL" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: compute-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        institute_id: ${{ fromJson(needs.compute-matrix.outputs.institutes) }}

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: main-branch/scraper/requirements.txt

      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y ghostscript poppler-utils tesseract-ocr tesseract-ocr-rus libgl1

      - name: Install Python deps
        run: pip install -r main-branch/scraper/requirements.txt

      - name: Checkout data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          REMOTE=https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          if git ls-remote --exit-code --heads "$REMOTE" data 2>/dev/null; then
            git clone --depth=1 --branch data "$REMOTE" data-branch
          else
            mkdir -p data-branch/meta data-branch/institutes
            cd data-branch
            git init -b data
            git remote add origin "$REMOTE"
          fi
          cd data-branch
          git config user.name "MPGU Schedule Bot"
          git config user.email "bot@github-actions"

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_PATH: ${{ github.workspace }}/data-branch
          CHANGED_ONLY: ${{ github.event.inputs.force_rescrape == 'true' && 'false' || 'true' }}
          INSTITUTE_ID: ${{ matrix.institute_id }}
          SKIP_TEACHERS: "true"
          PYTHONPATH: ${{ github.workspace }}/main-branch
        run: cd main-branch && python -m scraper.main

      - name: Push data to branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd data-branch
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add -A
          git diff --staged --quiet && echo "Нет изменений" && exit 0
          git commit -m "Scrape ${{ matrix.institute_id }} $(date -u '+%Y-%m-%d %H:%M UTC')"

          cat > /tmp/merge_idx.py << 'PYEOF'
          import json, pathlib, sys, subprocess
          inst_id = sys.argv[1] if len(sys.argv) > 1 else ""
          idx = pathlib.Path("meta/index.json")
          if not idx.exists() or not inst_id:
              sys.exit(0)
          try:
              our_raw = subprocess.check_output(["git", "show", "REBASE_HEAD:meta/index.json"])
              our_data = json.loads(our_raw)
              our_entry = next((e for e in our_data.get("institutes", []) if e["id"] == inst_id), None)
          except Exception as ex:
              sys.stderr.write(f"Warning: {ex}\n")
              sys.exit(0)
          if our_entry is None:
              sys.exit(0)
          data = json.loads(idx.read_text())
          merged = {e["id"]: e for e in data.get("institutes", [])}
          merged[inst_id] = our_entry
          data["institutes"] = list(merged.values())
          idx.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          print(f"Merged {inst_id} entry into index.json")
          PYEOF

          for i in 1 2 3 4 5; do
            git push origin data && echo "Pushed OK" && exit 0
            echo "Конфликт при пуше, ребейз (попытка $i)..."
            git pull --rebase origin data || {
              if git diff --name-only --diff-filter=U | grep -q "meta/index.json"; then
                git checkout --ours -- meta/index.json
                python3 /tmp/merge_idx.py "${{ matrix.institute_id }}"
                git add -- meta/index.json
              fi
              if git diff --name-only --diff-filter=U | grep -q "meta/hashes.json"; then
                git checkout --theirs -- meta/hashes.json
                git add -- meta/hashes.json
              fi
              UNMERGED=$(git diff --name-only --diff-filter=U)
              if [ -n "$UNMERGED" ]; then
                echo "$UNMERGED" | xargs git checkout --theirs --
                echo "$UNMERGED" | xargs git add
              fi
              GIT_EDITOR=true git rebase --continue
            }
            sleep $((i * 4))
          done
          echo "Все попытки пуша провалились" && exit 1

      - name: Alert on parser anomalies
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ALERTS="${{ github.workspace }}/data-branch/meta/alerts.json"
          [ -f "$ALERTS" ] || exit 0
          COUNT=$(python3 -c "import json; print(len(json.load(open('$ALERTS'))))")
          [ "$COUNT" -eq 0 ] && exit 0

          BODY=$(python3 - <<'PYEOF'
          import json, os
          alerts = json.load(open(os.environ['ALERTS']))
          lines = ["Скрапер обнаружил аномалии при обработке расписаний.\n"]
          for a in alerts:
              sev = "🔴" if a["severity"] == "high" else "🟡"
              lines.append(f"## {sev} {a['institute_name']}")
              lines.append(f"**Тип:** `{a['type']}`")
              lines.append(f"{a['message']}")
              lines.append("")
          lines.append("---")
          lines.append("*Создано автоматически GitHub Actions*")
          print("\n".join(lines))
          PYEOF
          )

          gh issue create \
            --repo "$GH_REPO" \
            --title "⚠ Парсер: аномалии (${{ matrix.institute_id }}, $(date -u '+%Y-%m-%d'))" \
            --body "$BODY" \
          || echo "Не удалось создать Issue"

      - name: Notify Telegram on anomalies
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS: ${{ github.workspace }}/data-branch/meta/alerts.json
        run: |
          [ -f "$ALERTS" ] || exit 0
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets не заданы — пропускаю уведомление"; exit 0
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('$ALERTS'))))")
          [ "$COUNT" -eq 0 ] && exit 0
          MSG=$(python3 - <<'PYEOF'
          import json, os
          alerts = json.load(open(os.environ['ALERTS']))
          lines = ["⚠ <b>MPGU Schedule — аномалии парсера</b>", ""]
          for a in alerts:
              sev = "🔴" if a.get("severity") == "high" else "🟡"
              lines.append(f"{sev} <b>{a['institute_name']}</b> [{a['type']}]")
              lines.append(a["message"])
              lines.append("")
          print("\n".join(lines).strip()[:3800])
          PYEOF
          )
          curl -sS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="$MSG" \
          >/dev/null && echo "Telegram отправлен" || echo "Не удалось отправить в Telegram"

  build-teachers:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: main-branch/scraper/requirements.txt

      - name: Install Python deps
        run: pip install -r main-branch/scraper/requirements.txt

      - name: Checkout data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          REMOTE=https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git clone --depth=1 --branch data "$REMOTE" data-branch
          cd data-branch
          git config user.name "MPGU Schedule Bot"
          git config user.email "bot@github-actions"

      - name: Rebuild teachers index
        env:
          DATA_PATH: ${{ github.workspace }}/data-branch
          TEACHERS_ONLY: "true"
          PYTHONPATH: ${{ github.workspace }}/main-branch
        run: cd main-branch && python -m scraper.main

      - name: Generate iCal feeds
        env:
          DATA_PATH: ${{ github.workspace }}/data-branch
          PYTHONPATH: ${{ github.workspace }}/main-branch
        run: cd main-branch && python -m scraper.build_ical

      - name: Build group search index
        env:
          DATA_PATH: ${{ github.workspace }}/data-branch
          PYTHONPATH: ${{ github.workspace }}/main-branch
        run: cd main-branch && python -m scraper.build_group_index

      - name: Push teachers index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd data-branch
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add meta/teachers.json meta/groups.json teachers/ ical/ 2>/dev/null || git add meta/teachers.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Rebuild teachers index + iCal $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push origin data && echo "Pushed OK" && exit 0
            git pull --rebase origin data
            sleep $((i * 2))
          done
          echo "Push failed" && exit 1
