name: Scrape Schedules

on:
  schedule:
    - cron: "0 5,17 * * *"   # 08:00 и 20:00 МСК (UTC+3)
  workflow_dispatch:
    inputs:
      institute_id:
        description: "ID конкретного института (пусто = все)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          fetch-depth: 1
        continue-on-error: true  # ветки data может не быть при первом запуске

      - name: Create data branch if missing
        working-directory: data-branch
        run: |
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://github.com/${{ github.repository }}.git
            git checkout -b data
          fi
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: main-branch/scraper/requirements.txt

      - name: Install system deps (camelot, pdf2image)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ghostscript poppler-utils

      - name: Install Python deps
        run: pip install -r main-branch/scraper/requirements.txt

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_PATH: ${{ github.workspace }}/data-branch
          CHANGED_ONLY: "true"
          INSTITUTE_ID: ${{ github.event.inputs.institute_id }}
          PYTHONPATH: ${{ github.workspace }}/main-branch
        run: |
          cd main-branch
          python -m scraper.main

      - name: Commit and push data
        working-directory: data-branch
        run: |
          git config user.name "MPGU Schedule Bot"
          git config user.email "bot@github-actions"
          git add -A
          git diff --staged --quiet && echo "Нет изменений" && exit 0

          git commit -m "Update $(date -u '+%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3 4; do
            git push -u origin data && break
            echo "Push неудача #$i, ждём $((i*2))с..."
            sleep $((i*2))
          done
