name: Scrape Schedules

on:
  schedule:
    - cron: "0 5,17 * * *"   # 08:00 и 20:00 МСК (UTC+3)
  workflow_dispatch:
    inputs:
      institute_id:
        description: "ID конкретного института (пусто = все)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Prepare data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf data-branch
          mkdir data-branch
          cd data-branch
          git init -b data
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin data --depth=1 2>/dev/null && git reset --hard origin/data || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: main-branch/scraper/requirements.txt

      - name: Install system deps (camelot, pdf2image)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ghostscript poppler-utils

      - name: Install Python deps
        run: pip install -r main-branch/scraper/requirements.txt

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_PATH: ${{ github.workspace }}/data-branch
          CHANGED_ONLY: "true"
          INSTITUTE_ID: ${{ github.event.inputs.institute_id }}
          PYTHONPATH: ${{ github.workspace }}/main-branch
        run: |
          cd main-branch
          python -m scraper.main

      - name: Debug data-branch
        run: |
          echo "=== Файлы в data-branch ==="
          find ${{ github.workspace }}/data-branch -not -path '*/.git/*' -type f 2>/dev/null || echo "(ничего)"
          echo "=== git status ==="
          cd ${{ github.workspace }}/data-branch && git status

      - name: Commit and push data
        working-directory: data-branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "MPGU Schedule Bot"
          git config user.email "bot@github-actions"
          git add -A
          git status
          git diff --staged --quiet && echo "Нет изменений" && exit 0

          git commit -m "Update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:refs/heads/data
