name: Telegram Bot (polling)

# Бот без внешнего хостинга: каждый запуск опрашивает Telegram ~55 минут и
# отвечает почти мгновенно, затем выходит; крон перезапускает (≈5 мин пауза в час).
# Нужен только секрет репозитория BOT_TOKEN (Settings → Secrets → Actions).
# Запустить вручную: Actions → Telegram Bot (polling) → Run workflow.

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:

# Не допускаем двух одновременных опросов (Telegram отдаёт 409 при конфликте)
concurrency:
  group: telegram-bot-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot (long-polling)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RUN_SECONDS: "3300"
        run: python -m scraper.telegram_bot
