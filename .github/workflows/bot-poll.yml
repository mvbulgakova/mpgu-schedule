name: Telegram Bot (polling)

# Бот без внешнего хостинга: каждый запуск опрашивает Telegram ~55 минут и
# отвечает почти мгновенно, затем выходит; крон перезапускает (≈5 мин пауза в час).
# Нужен только секрет репозитория BOT_TOKEN (Settings → Secrets → Actions).
# Запустить вручную: Actions → Telegram Bot (polling) → Run workflow.

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:

# При ручном запуске или новом кроне — отменяем старый, стартуем свежий
concurrency:
  group: telegram-bot-poll
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic>=0.30

      - name: Check token and delete webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "=== getMe ==="
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | python3 -m json.tool
          echo "=== deleteWebhook ==="
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/deleteWebhook?drop_pending_updates=true" | python3 -m json.tool
          echo "=== getWebhookInfo ==="
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo" | python3 -m json.tool

      - name: Run bot (long-polling)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_SECONDS: "3300"
        run: python -m scraper.telegram_bot
