name: Telegram Bot (polling)

# Бот без внешнего хостинга: запуск опрашивает Telegram ~5.5 часов, затем выходит.
# Планировщик GitHub пропускает кроны в часы пик (реальные интервалы 1–3.5 ч) —
# поэтому раны длинные, а частые кроны служат «подхватом»: пока ран идёт, новый
# триггер ЖДЁТ в очереди (cancel-in-progress: false) и стартует сразу после его
# завершения. Для суток покрытия хватает 4–5 сработавших кронов из 24.
# Секреты репозитория: BOT_TOKEN и ANTHROPIC_API_KEY (Settings → Secrets → Actions).
# Срочно передеплоить код: отменить текущий ран вручную → очередь стартует новый.
#
# Ручные разовые рассылки (mode=seats_increased|quota) ЖИВУТ ЗДЕСЬ ЖЕ, В ТОМ
# ЖЕ JOB'Е, а не в отдельном workflow-файле или отдельном job'е: проверено
# эмпирически 2026-08-04 — GitHub Actions cache не даёт РАЗНЫМ job'ам читать
# кэш друг друга, даже в одном workflow-файле на одной ветке (restore
# отдельного job'а «notify» не находил кэш, сохранённый job'ом «poll», ни по
# префиксу, ни по точному известному ключу). Единственный надёжно рабочий
# случай — тот же job, что сохранял. Поэтому рассылка — это шаг ВНУТРИ
# ЕДИНСТВЕННОГО job'а poll, просто выполняется ВМЕСТО поллинга при mode≠poll.
# Следствие: разовая рассылка встаёт в ту же очередь concurrency, что и
# обычный поллинг — если сейчас идёт 5.5-часовой поллинг-ран, рассылка
# подождёт его завершения (или отмени текущий ран вручную, чтобы не ждать).
#
# Запуск разовой рассылки: Actions → Telegram Bot (polling) → Run workflow →
# mode: seats_increased (+ baseline_ref) или mode: quota (+ list_code) или
# mode: seats_increased_from_order (+ baseline_ref).

on:
  schedule:
    - cron: "0 * * * *"   # каждый час (сработает — встанет в очередь)
  workflow_dispatch:
    inputs:
      mode:
        description: "poll (обычный запуск бота) | seats_increased | seats_increased_from_order | quota | correction"
        required: false
        default: "poll"
      baseline_ref:
        description: "SHA/ref на ветке data ДО приказа — для mode=seats_increased и mode=seats_increased_from_order"
        required: false
      list_code:
        description: "код списка — для mode=quota и mode=correction"
        required: false
      message:
        description: "текст рассылки — только для mode=correction"
        required: false

# НЕ отменяем работающий ран: новый ждёт в очереди и подхватывает сразу после.
# Разовые рассылки (mode≠poll) — та же очередь: см. комментарий выше.
concurrency:
  group: telegram-bot-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "anthropic>=0.30"

      # Подписки «следи за кодом» переживают рестарты через actions/cache
      # (не в data-ветке: связка chat_id ↔ код не должна быть публичной).
      - name: Restore state (subscriptions + feedback)
        uses: actions/cache/restore@v4
        with:
          path: |
            subs.json
            feedback.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-
            bot-subs-

      - name: Run bot (long-polling)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'poll' || github.event.inputs.mode == ''
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_SECONDS: "19800"
          SUBS_PATH: subs.json
          FEEDBACK_PATH: feedback.json
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PYTHONUNBUFFERED: "1"   # реальные метки времени в логах, а не всё при выходе
        run: python -m scraper.telegram_bot

      - name: Seats increased notify
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'seats_increased'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUBS_PATH: subs.json
          BASELINE_META_PATH: baseline_meta.json
          LISTS_META_PATH: lists_meta.json
          BASELINE_REF: ${{ github.event.inputs.baseline_ref }}
        run: |
          if [ -z "$BASELINE_REF" ]; then
            echo "::error::baseline_ref обязателен для mode=seats_increased"
            exit 1
          fi
          git fetch --filter=blob:none origin data
          git show -s --format='Baseline: %h %ci %s' "$BASELINE_REF"
          git show "$BASELINE_REF:admissions/lists_meta.json" > baseline_meta.json
          git show origin/data:admissions/lists_meta.json > lists_meta.json
          python -m scraper.notify_seats_increased

      - name: Seats increased notify (from order)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'seats_increased_from_order'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUBS_PATH: subs.json
          BASELINE_META_PATH: baseline_meta.json
          LISTS_META_PATH: lists_meta.json
          ORDER_RECORDS_PATH: order_records.json
          EXCLUDE_CODES_PATH: exclude_codes.json
          BASELINE_REF: ${{ github.event.inputs.baseline_ref }}
        run: |
          if [ -z "$BASELINE_REF" ]; then
            echo "::error::baseline_ref обязателен для mode=seats_increased_from_order"
            exit 1
          fi
          git fetch --filter=blob:none origin data
          git show -s --format='Baseline: %h %ci %s' "$BASELINE_REF"
          git show "$BASELINE_REF:admissions/lists_meta.json" > baseline_meta.json
          git show origin/data:admissions/lists_meta.json > lists_meta.json
          git show origin/data:admissions/order_records.json > order_records.json
          # Коды, которым уже отправлено mode=seats_increased по живым данным
          # epk25 (тот же baseline/current), исключаем — иначе подписчик
          # получит два уведомления про один и тот же список. Однострочник —
          # чтобы не ловить IndentationError от отступа YAML-блока внутри
          # heredoc/питоновского тела (Python требует нулевой отступ у
          # верхнеуровневых операторов).
          python -c "import json; from scraper.abitur import quota_vacancy as qv; b=json.load(open('baseline_meta.json'))['lists']; c=json.load(open('lists_meta.json'))['lists']; json.dump(list(qv.seats_increased(b, c)), open('exclude_codes.json', 'w'))"
          python -m scraper.notify_seats_increased_from_order

      - name: Quota notify
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'quota'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUBS_PATH: subs.json
          LISTS_META_PATH: lists_meta.json
          LIST_CODE: ${{ github.event.inputs.list_code }}
        run: |
          if [ -z "$LIST_CODE" ]; then
            echo "::error::list_code обязателен для mode=quota"
            exit 1
          fi
          git fetch --depth=1 origin data
          git show origin/data:admissions/lists_meta.json > lists_meta.json
          python -m scraper.notify_quota_seats --code "$LIST_CODE"

      - name: Correction notify
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'correction'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUBS_PATH: subs.json
          LIST_CODE: ${{ github.event.inputs.list_code }}
          CORRECTION_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          if [ -z "$LIST_CODE" ] || [ -z "$CORRECTION_MESSAGE" ]; then
            echo "::error::list_code и message обязательны для mode=correction"
            exit 1
          fi
          python -m scraper.notify_correction --list-code "$LIST_CODE"

      - name: Save state (subscriptions + feedback)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            subs.json
            feedback.json
          key: bot-state-${{ github.run_id }}
