name: Telegram Bot (polling)

# Бот без внешнего хостинга: каждый запуск опрашивает Telegram ~55 минут и
# отвечает почти мгновенно, затем выходит; крон перезапускает (≈5 мин пауза в час).
# Секреты репозитория: BOT_TOKEN и ANTHROPIC_API_KEY (Settings → Secrets → Actions).
# Запустить вручную: Actions → Telegram Bot (polling) → Run workflow.

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:

# При ручном запуске или новом кроне — отменяем старый, стартуем свежий
concurrency:
  group: telegram-bot-poll
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "anthropic>=0.30"

      # Подписки «следи за кодом» переживают рестарты через actions/cache
      # (не в data-ветке: связка chat_id ↔ код не должна быть публичной).
      - name: Restore subscriptions
        uses: actions/cache/restore@v4
        with:
          path: subs.json
          key: bot-subs-${{ github.run_id }}
          restore-keys: |
            bot-subs-

      - name: Run bot (long-polling)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_SECONDS: "3300"
          SUBS_PATH: subs.json
          PYTHONUNBUFFERED: "1"   # реальные метки времени в логах, а не всё при выходе
        run: python -m scraper.telegram_bot

      - name: Save subscriptions
        if: always()
        uses: actions/cache/save@v4
        with:
          path: subs.json
          key: bot-subs-${{ github.run_id }}
