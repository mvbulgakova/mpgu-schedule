name: Scrape Admissions Data

on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 МСК ежедневно
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          ref: data
          path: .data-wt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          DATA_PATH: .data-wt
        run: python scraper/admission_scraper.py

      - name: Commit and push to data branch
        run: |
          cd .data-wt
          git config user.email "bot@mpgu-schedule"
          git config user.name "mpgu-bot"
          git add -A
          git diff --staged --quiet || git commit -m "admissions: auto-update $(date -u +%Y-%m-%d)"
          git push origin data
