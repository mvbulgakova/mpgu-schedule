name: Fetch Competitive Lists

# Периодический скрейп конкурсных списков epk25 → индекс в data-ветке.
# Актуально в сроки приёмной кампании.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"          # базово: раз в час
    - cron: "*/5 * 25-31 7 *"    # горячая фаза: каждые 5 мин 25–31 июля
    - cron: "*/5 * 1-11 8 *"     # и 1–11 августа (этапы зачисления)

concurrency:
  group: fetch-lists
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # НЕ занижать. Локально обход идёт единицы минут, но с раннеров GitHub
    # epk25 отвечает во много раз медленнее: 2026-08-05 прогон с 8 потоками
    # шёл 49 минут и был убит прежним таймаутом (в логе — ни строки, поэтому
    # теперь обход печатает прогресс). Оборванный на середине прогон = ноль
    # обновлений, что хуже медленного. Держим запас, пока прогресс-лог не
    # покажет реальное время.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 0   # нужна история: публикация делает rebase на вершину

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Build lists index
        env:
          DATA_PATH: data
        run: python -m scraper.build_lists_index
