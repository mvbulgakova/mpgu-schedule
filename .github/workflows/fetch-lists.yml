name: Fetch Competitive Lists

# Периодический скрейп конкурсных списков epk25 → индекс в data-ветке.
# Актуально в сроки приёмной кампании.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"          # базово: раз в час
    - cron: "*/5 * 25-31 7 *"    # горячая фаза: каждые 5 мин 25–31 июля
    - cron: "*/5 * 1-11 8 *"     # и 1–11 августа (этапы зачисления)

concurrency:
  group: fetch-lists
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Списки (view?code=...) снимаются пулом из 8 потоков, упавшие — вторым
    # последовательным проходом (см. scraper/fetchers/lists_fetcher.py).
    # Обычный обход — единицы минут, но если epk25 под нагрузкой уронит пул
    # целиком, второй проход идёт по одной странице с паузой и занимает
    # ~20 минут. Таймаут должен это переживать: оборванный на середине
    # прогон = ноль обновлений, а не «медленно, но обновились».
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 0   # нужна история: публикация делает rebase на вершину

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Build lists index
        env:
          DATA_PATH: data
        run: python -m scraper.build_lists_index
