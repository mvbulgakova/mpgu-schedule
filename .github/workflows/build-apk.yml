name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Generate wrapper & build APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpgu-schedule-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes 2>/dev/null || true
          gh release create apk-latest \
            --title "Расписание МПГУ — Android APK" \
            --notes $'APK для установки на Android 8.0+.\n\n**Установка:**\n1. Скачать APK\n2. Открыть файл на телефоне\n3. Разрешить установку из неизвестных источников, если спросит' \
            --latest \
            "android/app/build/outputs/apk/debug/app-debug.apk#mpgu-schedule.apk"
