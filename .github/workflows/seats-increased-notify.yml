name: Seats Increased Notify

# Ручной запуск (Actions → Seats Increased Notify → Run workflow, ввести
# SHA/ref снимка на ветке data ДО нужного приказа). Разовая рассылка
# подписчикам каждого общего списка, у которого КЦП подтверждённо вырос —
# места вернулись из квот/БВИ (см.
# scraper/abitur/quota_vacancy.py::seats_increased). Baseline подбирается
# вручную под конкретный приказ — НЕ автоматизировано намеренно.
# Секреты репозитория: BOT_TOKEN (Settings → Secrets → Actions).

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "SHA/ref на ветке data ДО приказа (baseline для сравнения)"
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "anthropic>=0.30"

      # Тот же кэш, что использует bot-poll.yml, — восстанавливаем ТЕКУЩИЙ
      # снимок подписок (актуальность до часа, этого достаточно для прикидки).
      - name: Restore subscriptions
        uses: actions/cache/restore@v4
        with:
          path: subs.json
          key: bot-state-seats-notify-${{ github.run_id }}
          restore-keys: |
            bot-state-30818914445
            bot-state-
            bot-subs-

      - name: Debug cache restore result
        run: |
          echo "subs.json present: $(test -f subs.json && echo yes || echo no)"
          ls -la subs.json 2>&1 || true
          wc -c subs.json 2>&1 || true

      # Blobless partial fetch: pulls full commit/tree history (small) so
      # git show can reach ANY historical commit on data, but defers blob
      # content to on-demand fetches — keeps this cheap as the orphan data
      # branch (786+ commits, ~605 MB, growing every 15-25 min in season)
      # keeps growing. Not --depth=1: that would only have the latest commit,
      # breaking lookups for any baseline_ref but the newest one.
      - name: Fetch data branch history
        run: git fetch --filter=blob:none origin data

      - name: Extract baseline and current lists_meta.json
        env:
          BASELINE_REF: ${{ github.event.inputs.baseline_ref }}
        run: |
          if [ -z "$BASELINE_REF" ]; then
            echo "::error::baseline_ref is empty"
            exit 1
          fi
          git show -s --format='Baseline: %h %ci %s' "$BASELINE_REF"
          git show "$BASELINE_REF:admissions/lists_meta.json" > baseline_meta.json
          git show origin/data:admissions/lists_meta.json > lists_meta.json

      - name: Send notifications
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUBS_PATH: subs.json
          BASELINE_META_PATH: baseline_meta.json
          LISTS_META_PATH: lists_meta.json
        run: python -m scraper.notify_seats_increased
