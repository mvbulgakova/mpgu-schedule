name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pwa/package.json

      - name: Install deps
        working-directory: pwa
        run: npm ci

      - name: Build
        working-directory: pwa
        env:
          VITE_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pwa/dist
          cname: ""  # добавь домен сюда если будет кастомный
