name: Build WebView APK
on:
  push:
      branches: [ main ]
        workflow_dispatch:
        jobs:
          build:
              runs-on: ubuntu-latest
                  steps:
                        - uses: actions/checkout@v4
                              - uses: actions/setup-java@v4
                                      with:
                                                java-version: '17'
                                                          distribution: 'temurin'
                                                                - name: Install Gradle
                                                                        run: |
                                                                                  curl -L -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.4-bin.zip"
                                                                                            unzip -q /tmp/gradle.zip -d $HOME/gradle-dist
                                                                                                      echo "$HOME/gradle-dist/gradle-8.4/bin" >> $GITHUB_PATH
                                                                                                            - name: Generate Wrapper
                                                                                                                    working-directory: android
                                                                                                                            run: gradle wrapper --gradle-version 8.4
                                                                                                                                  - name: Build APK
                                                                                                                                          working-directory: android
                                                                                                                                                  run: |
                                                                                                                                                            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
                                                                                                                                                                      chmod +x gradlew
                                                                                                                                                                                ./gradlew assembleDebug
                                                                                                                                                                                      - name: Upload APK
                                                                                                                                                                                              uses: actions/upload-artifact@v4
                                                                                                                                                                                                      with:
                                                                                                                                                                                                                name: hyperbolic-geometry-apk
                                                                                                                                                                                                                          path: android/app/build/outputs/apk/debug/app-debug.apk